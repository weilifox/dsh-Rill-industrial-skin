<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Rill Industrial Skin preview">
  <defs>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8c0e4"/>
      <stop offset="1" stop-color="#6e8ab4"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3f5c"/>
      <stop offset="1" stop-color="#101a29"/>
    </linearGradient>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="3" fill="none"/>
      <rect width="4" height="1" fill="#ffffff" opacity="0.03"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- field -->
  <rect width="1200" height="760" fill="#0f1622"/>
  <rect x="-10" y="-10" width="1220" height="780" fill="url(#wallGrad)" opacity="0.42" filter="url(#soft)"/>
  <rect width="1200" height="760" fill="url(#scan)"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="300" height="760" fill="#0b111b" opacity="0.92"/>
  <rect x="299" y="0" width="1" height="760" fill="#ffffff" opacity="0.18"/>

  <!-- brand -->
  <g transform="translate(24,28)">
    <g fill="#8aa8d6">
      <rect x="0" y="6" width="2.4" height="1.9"/>
      <rect x="19.1" y="6" width="1.7" height="1.9" opacity="0.55"/>
      <path d="M1.6 3.1h9.9c3.1 0 5.4 1.3 6.6 3.5-1.5 2.6-4.2 3.9-7.4 3.9-4.3 0-7.6-1.9-9.1-4.9V3.1z"/>
      <path d="M16.6 4.3l3.6-2.1v7.1l-3.6-2.1v-2.9z"/>
      <path d="M0.6 0.2l2.6 1.4-1.4 2.4-1.2-3.8z" opacity="0.85"/>
    </g>
    <circle cx="4.5" cy="5.2" r="0.95" fill="#0b111b"/>
    <text x="30" y="8" font-family="Bahnschrift, 'Segoe UI Semibold', sans-serif" font-size="12"
          font-weight="600" letter-spacing="2.4" fill="#ffffff">DEEP<tspan fill="#8aa8d6">SEEK</tspan></text>
    <rect x="30" y="13" width="86" height="2" fill="#8aa8d6" opacity="0.85"/>
    <text x="30" y="26" font-family="Consolas, monospace" font-size="7.5" letter-spacing="1.2"
          fill="#ffffff" opacity="0.5">RILL INDUSTRIAL</text>
  </g>

  <!-- nav -->
  <g font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="11" fill="#ffffff" opacity="0.72">
    <rect x="16" y="86" width="268" height="30" fill="#ffffff" opacity="0.09"/>
    <rect x="16" y="86" width="2" height="30" fill="#8aa8d6"/>
    <text x="30" y="105">新会话</text>
    <text x="30" y="139">会话记录</text>
    <text x="30" y="169">设置</text>
  </g>
  <rect x="16" y="196" width="268" height="1" fill="#ffffff" opacity="0.12"/>

  <!-- main header -->
  <rect x="300" y="0" width="900" height="52" fill="#ffffff" opacity="0.03"/>
  <rect x="300" y="51" width="900" height="1" fill="#ffffff" opacity="0.16"/>
  <text x="328" y="32" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="12"
        letter-spacing="2.2" fill="#ffffff" opacity="0.9">RILL INDUSTRIAL SKIN</text>

  <!-- messages -->
  <g font-family="Bahnschrift, 'Segoe UI', sans-serif">
    <rect x="360" y="96" width="560" height="66" fill="#182230" opacity="0.9"/>
    <rect x="360" y="96" width="1" height="66" fill="#8aa8d6"/>
    <text x="378" y="124" font-size="11" fill="#ffffff" opacity="0.95">工业电子风皮肤：深蓝直角工作区、白字、鲸鱼字标</text>
    <text x="378" y="145" font-size="10" fill="#ffffff" opacity="0.5">—— palette never touches type colour</text>

    <rect x="360" y="180" width="700" height="120" fill="#ffffff" opacity="0.04"/>
    <text x="378" y="208" font-size="11" fill="#ffffff" opacity="0.95">五种低饱和配色：黛蓝 · 宋青 · 橙青 · 深蓝 · 粉霞</text>
    <text x="378" y="230" font-size="10" fill="#ffffff" opacity="0.6">壁纸 0–100% 不透明度 · 0–40px 模糊</text>
    <text x="378" y="250" font-size="10" fill="#ffffff" opacity="0.6">对话框直角毛玻璃 8–100%</text>
    <g>
      <rect x="378" y="266" width="120" height="12" fill="#0f1622"/>
      <rect x="378" y="266" width="40" height="12" fill="#8aa8d6"/>
      <rect x="506" y="266" width="120" height="12" fill="#0c1e21"/>
      <rect x="506" y="266" width="40" height="12" fill="#7cbeb0"/>
      <rect x="634" y="266" width="120" height="12" fill="#0a1e20"/>
      <rect x="634" y="266" width="40" height="12" fill="#e29e5c"/>
      <rect x="762" y="266" width="120" height="12" fill="#091a1e"/>
      <rect x="762" y="266" width="40" height="12" fill="#749ae2"/>
      <rect x="890" y="266" width="120" height="12" fill="#1e121e"/>
      <rect x="890" y="266" width="40" height="12" fill="#d896ae"/>
    </g>
  </g>

  <!-- composer card -->
  <rect x="360" y="556" width="700" height="132" fill="#182230" opacity="0.55"/>
  <rect x="360.5" y="556.5" width="699" height="131" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
  <rect x="360" y="556" width="700" height="1" fill="#ffffff" opacity="0.09"/>
  <text x="382" y="586" font-family="Consolas, monospace" font-size="10" letter-spacing="1"
        fill="#ffffff" opacity="0.46">描述你想构建的东西…</text>
  <g font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="9" fill="#ffffff" opacity="0.45">
    <rect x="380" y="640" width="54" height="20" fill="#ffffff" opacity="0.06"/>
    <text x="390" y="654">⚙ 工具</text>
    <rect x="442" y="640" width="54" height="20" fill="#ffffff" opacity="0.06"/>
    <text x="452" y="654">◈ 模型</text>
  </g>

  <!-- raised send key -->
  <g>
    <rect x="974" y="632" width="66" height="38" fill="#2b3a4d"/>
    <rect x="972" y="624" width="70" height="42" fill="url(#keyGrad)"/>
    <rect x="972" y="624" width="70" height="2" fill="#ffffff" opacity="0.45"/>
    <rect x="972" y="663" width="70" height="3" fill="#000000" opacity="0.26"/>
    <rect x="972.5" y="624.5" width="69" height="41" fill="none" stroke="#5a6f90"/>
    <g transform="translate(996,636)" fill="#ffffff">
      <path d="M0 6l11-6v12z" transform="rotate(-90 6 6)"/>
    </g>
  </g>

  <!-- caption -->
  <text x="360" y="726" font-family="Consolas, monospace" font-size="9.5" letter-spacing="1.6"
        fill="#ffffff" opacity="0.4">RILL INDUSTRIAL SKIN v1.0 · RECTILINEAR · DUAL APPEARANCE</text>
</svg>
