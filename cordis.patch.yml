# rill-industrial-skin — profile bundle patch.
#
# One row: the host half (`lib/index.js`, currently a no-op that only declares
# the package identity). The browser half is picked up by dsh-client-modules
# through package.json's `dsh.client` declaration, exactly like the shipped
# ui-* packages — it needs no row of its own.
#
# The row id (`rill-industrial-skin`) is the loader entry id and therefore also
# the id the profile uses to disable or configure this bundle.
- insert:
    - id: rill-industrial-skin
      name: 'rill-industrial-skin'
